name: windows-build

# ---------------------------------------------------------------------------
# Per-push / per-PR Windows CI build.
#
# SECURITY MODEL
#
# The S3 mirror upload + Discord webhook only run when ALL of these are true:
#   github.event_name == 'push'              (not pull_request)
#   github.ref == 'refs/heads/master'        (not a feature branch, not a tag)
#   github.repository == 'OpenFodder/OpenFodder'  (not a fork build)
#
# Without the repo-name guard, a fork's mirror of master-branch pushes
# would also try to use secrets (which forks never receive — the run would
# fail noisily — but adding the explicit gate makes the contract obvious to
# anyone reading the file).
#
# Third-party actions are pinned to commit SHAs to defend against silent
# tag retargeting. To bump, look up the commit for the tag (e.g.
# `gh api repos/actions/checkout/git/ref/tags/v4`) and edit the SHA below.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

permissions:
  contents: read

# Cancel an in-flight run on the same branch when a new commit lands —
# the latest commit's status is the one that matters. Tagged release runs
# go through release.yml, not this workflow, so they aren't affected.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_platform: x64
            configuration: Release
            cmake_extra_args: ""
            vcpkg_triplet: x64-windows-release
          - arch: x86
            cmake_platform: Win32
            configuration: Release
            cmake_extra_args: -DWITH_ASM=OFF
            vcpkg_triplet: x86-windows-release
    steps:
      # actions/checkout@v4 — pinned by commit SHA.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select Visual Studio generator
        id: vs_generator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstances = & $vswhere -latest -products * -format json | ConvertFrom-Json
          $vsInstance = @($vsInstances)[0]
          if ($null -eq $vsInstance) {
            Write-Error "No Visual Studio installation was found."
            exit 1
          }

          $vsVersion = [string]$vsInstance.installationVersion
          if ([string]::IsNullOrWhiteSpace($vsVersion)) {
            Write-Error "Visual Studio installation did not report a version."
            exit 1
          }

          $vcToolsVersionFile = Join-Path $vsInstance.installationPath "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          if (-not (Test-Path $vcToolsVersionFile)) {
            Write-Error "Visual Studio was found, but C++ tools were not found at $vcToolsVersionFile."
            exit 1
          }

          $major = [int]($vsVersion.Split(".")[0])
          if ($major -ge 18) {
            $generator = "Visual Studio 18 2026"
          } elseif ($major -eq 17) {
            $generator = "Visual Studio 17 2022"
          } else {
            Write-Error "Unsupported Visual Studio version: $vsVersion"
            exit 1
          }

          $cmake = Get-Command cmake -ErrorAction SilentlyContinue
          if ($null -eq $cmake) {
            Write-Error "CMake was not found on PATH."
            exit 1
          }

          $cmakeHelp = & $cmake.Source --help | Out-String
          if (-not $cmakeHelp.Contains($generator)) {
            Write-Error "The installed CMake does not support the '$generator' generator."
            exit 1
          }

          "cmake_generator=$generator" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "vs_major=$major" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "toolchain_key=$vsVersion-$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VCPKG_DOWNLOADS=$env:RUNNER_TEMP/vcpkg-downloads" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP/vcpkg-binarycache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using CMake generator: $generator"
      - name: Cache vcpkg
        id: vcpkg-cache
        # actions/cache@v4 — pinned by commit SHA.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/vcpkg-downloads
            ${{ runner.temp }}/vcpkg-binarycache
          key: ${{ runner.os }}-${{ matrix.arch }}-vcpkg-${{ steps.vs_generator.outputs.toolchain_key }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/*.cmake', 'cmake/ports/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-vcpkg-${{ steps.vs_generator.outputs.toolchain_key }}-
            ${{ runner.os }}-${{ matrix.arch }}-vcpkg-
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          ./cmake/BootstrapVcpkg.ps1 -Root "$env:RUNNER_TEMP/vcpkg"
      - name: Cache CMake deps
        # actions/cache@v4 — pinned by commit SHA.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: Projects/VS/_deps
          key: ${{ runner.os }}-${{ matrix.arch }}-vs${{ steps.vs_generator.outputs.vs_major }}-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: >-
          cmake -S . -B Projects/VS -G "${{ steps.vs_generator.outputs.cmake_generator }}"
          -A ${{ matrix.cmake_platform }} ${{ matrix.cmake_extra_args }}
          -DOPENFODDER_ENABLE_FFMPEG=ON
          -DOPENFODDER_BUILD_MEDIA_TESTS=ON
          "-DCMAKE_TOOLCHAIN_FILE=${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
          "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${{ github.workspace }}/Projects/VS/bin"
      - name: Save vcpkg packages before building the game
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/vcpkg-downloads
            ${{ runner.temp }}/vcpkg-binarycache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build Projects/VS --config ${{ matrix.configuration }} --parallel
      - name: Check packaged audio decoders
        if: matrix.arch == 'x64'
        run: python Tests/AudioMixer/check.py --runtime "Projects/VS/bin/${{ matrix.configuration }}"
      - name: Check MPEG video and audio decoding
        run: ctest --test-dir Projects/VS -C ${{ matrix.configuration }} --output-on-failure --no-tests=error
      - name: Test
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeDir = "$env:GITHUB_WORKSPACE/Projects/VS/bin/${{ matrix.configuration }}"
          $testRoot = Join-Path $env:RUNNER_TEMP ("openfodder-test-" + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          foreach ($folder in @('Data', 'Scripts', 'Campaigns', 'Saves')) {
            Copy-Item "$env:GITHUB_WORKSPACE/Run/$folder" $testRoot -Recurse -Force
          }
          Copy-Item "$runtimeDir/openfodder.exe" $testRoot
          Copy-Item "$runtimeDir/*.dll" $testRoot
          git clone --depth 1 https://github.com/OpenFodder/tests.git "$testRoot/Tests"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch game tests' }
          Push-Location $testRoot
          try {
            ./openfodder.exe --appveyor --unit-test-headless
            if ($LASTEXITCODE -ne 0) { throw "Game tests failed: $LASTEXITCODE" }
          } finally { Pop-Location }
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ matrix.arch }}-failure-logs
          path: |
            Projects/VS/vcpkg-manifest-install.log
            Projects/VS/CMakeFiles/CMakeConfigureLog.yaml
            Projects/VS/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "OpenFodder-${{ matrix.arch }}-${{ matrix.configuration }}-latest.zip"
          $runtimeDir = "$env:GITHUB_WORKSPACE/Projects/VS/bin/${{ matrix.configuration }}"
          $items = @(
            "$runtimeDir/openfodder.exe",
            "$env:GITHUB_WORKSPACE/README.md",
            "$env:GITHUB_WORKSPACE/COPYING",
            "$env:GITHUB_WORKSPACE/openfodder.ini.example"
          ) + @(Get-ChildItem -LiteralPath $runtimeDir -Filter '*.dll' -File | Select-Object -ExpandProperty FullName)
          Compress-Archive -Path $items -DestinationPath $archive -Force
      - name: Upload artifact
        # actions/upload-artifact@v4 — pinned by commit SHA.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload_artifact
        with:
          name: OpenFodder-${{ matrix.arch }}-${{ matrix.configuration }}-latest
          path: OpenFodder-${{ matrix.arch }}-${{ matrix.configuration }}-latest.zip
      # ---------------------------------------------------------------------
      # The S3 mirror + Discord notification consume secrets, so they're
      # gated on three things:
      #   1. event_name == 'push'                  — never on pull_request.
      #   2. ref == 'refs/heads/master'            — never a feature branch.
      #   3. repository == 'OpenFodder/OpenFodder' — never a fork build.
      # GitHub already withholds secrets from forked-PR runs, but the
      # explicit repo guard documents intent and protects against future
      # config changes that might inadvertently expose secrets.
      # ---------------------------------------------------------------------
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'OpenFodder/OpenFodder'
        # aws-actions/configure-aws-credentials@v4 — pinned by commit SHA.
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Upload build zip to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'OpenFodder/OpenFodder'
        shell: pwsh
        run: |
          $zipName = "OpenFodder-${{ matrix.arch }}-${{ matrix.configuration }}-latest.zip"
          aws s3 cp "$zipName" "s3://openfodder-builds/$zipName" --acl public-read
      - name: Discord notification
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'OpenFodder/OpenFodder'
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) { exit 0 }

          $status = if ("${{ job.status }}" -eq "success") { "Success" } else { "Failure" }
          $color = if ("${{ job.status }}" -eq "success") { 3066993 } else { 15158332 }
          $title = "OpenFodder Windows build $status (${{ matrix.arch }})"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $artifactUrl = "https://s3.amazonaws.com/openfodder-builds/OpenFodder-${{ matrix.arch }}-${{ matrix.configuration }}-latest.zip"
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $commitMessage = $event.head_commit.message
          if (-not $commitMessage) { $commitMessage = $event.pull_request.title }
          if (-not $commitMessage) { $commitMessage = "N/A" }
          $payload = @{
            username = "GitHub Actions"
            embeds = @(
              @{
                title = $title
                url = $runUrl
                color = $color
                fields = @(
                  @{ name = "Commit"; value = "${{ github.sha }}"; inline = $true }
                  @{ name = "Branch"; value = "${{ github.ref_name }}"; inline = $true }
                  @{ name = "Config"; value = "${{ matrix.configuration }}"; inline = $true }
                  @{ name = "Commit Message"; value = $commitMessage; inline = $false }
                  @{ name = "Download"; value = $artifactUrl; inline = $false }
                )
              }
            )
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK_URL -ContentType "application/json" -Body $payload
